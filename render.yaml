services:
  - type: web
    name: attendly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd Backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: ATTENDANCE_ADMIN_PASSWORD
        sync: false
      - key: ATTENDANCE_TOKEN_SECRET
        generateValue: true
